            {

                color: "bg-orange-100 text-orange-600",
                text: "একদিন মক্কার এক বৃদ্ধা মহিলা প্রতিদিন মহানবী হযরত মুহাম্মদ (সা:) এর যাওয়ার পথে কাঁটা বিছিয়ে রাখত। নবীজী (সা:) কখনোই রাগ করতেন না, নীরবে কাঁটা সরিয়ে চলে যেতেন।<br><br>একদিন নবীজী দেখলেন পথে কোনো কাঁটা নেই। তিনি ভাবলেন, বৃদ্ধা হয়তো অসুস্থ। তিনি সোজা বৃদ্ধার বাড়িতে গিয়ে উপস্থিত হলেন। বৃদ্ধা তো অবাক! যে মানুষের সাথে সে এত খারাপ আচরণ করেছে, সে কিনা তাকে দেখতে এসেছে!<br><br>নবীজীর (সা:) এই অসীম ক্ষমা ও ভালোবাসা দেখে বৃদ্ধা খুব লজ্জিত হলো এবং সাথে সাথে ইসলাম গ্রহণ করল।<br><br><b>শিক্ষা:</b> খারাপ আচরণের জবাব ভালো ব্যবহার দিয়ে দিতে হয়। ক্ষমা হলো সবচেয়ে বড় গুণ।"
            },
            {
                id: 2,
                title: "হযরত সুলাইমান (আঃ) ও পিপীলিকা",
                icon: "🐜",
                color: "bg-emerald-100 text-emerald-600",
                text: "হযরত সুলাইমান (আঃ) পশুপাখির ভাষা বুঝতে পারতেন। একদিন তিনি তার বিশাল সেনাবাহিনী নিয়ে এক পথ দিয়ে যাচ্ছিলেন।<br><br>সামনেই ছিল একটি পিপীলিকার বাসা। একটি ছোট্ট পিপীলিকা অন্য পিপীলিকাদের বলল, 'হে পিপীলিকারা! তাড়াতাড়ি নিজেদের গর্তে ঢুকে পড়ো। সুলাইমান ও তার সেনাবাহিনী না বুঝেই তোমাদের পায়ের নিচে পিষে ফেলবে!'<br><br>পিপীলিকার এই কথা শুনে হযরত সুলাইমান (আঃ) মুচকি হাসলেন। তিনি সাথে সাথে তাঁর সেনাবাহিনীকে থামার নির্দেশ দিলেন এবং সাবধানে রাস্তা পার হলেন, যাতে একটি পিপীলিকারও ক্ষতি না হয়।<br><br><b>শিক্ষা:</b> আল্লাহর সৃষ্ট কোনো ছোট প্রাণীকেও অবহেলা বা কষ্ট দেওয়া উচিত নয়। সবার প্রতি দয়াশীল হতে হয়।"

                color: "bg-blue-100 text-blue-600",

            },

            },
            {

                text: "জাবির (রা.) বলেন, 'আমি ইসলাম গ্রহণ করার পর থেকে নবীজি (সা.) আমাকে কখনোই কাছে আসতে নিষেধ করেননি। আর যখনই তিনি আমার দিকে তাকাতেন, তখনই তিনি মুচকি হাসতেন।' নবীজির এই হাসিমুখের স্বভাবের কারণেই মানুষ তাঁর প্রতি এত আকৃষ্ট হতো。<br><br><b>শিক্ষা:</b> হাসিমুখে মানুষের সাথে কথা বলাও সদকা বা পুণ্য।"
            },
            {
                id: 98,
                title: "নবীজির দরবারে হরিণী",
                icon: "🦌",
                color: "bg-lime-200 text-lime-800",
                text: "নবীজি (সা.) একবার দেখলেন একটি বাঁধা হরিণী ছটফট করছে। হরিণীটি ইশারায় জানাল, তার ছোট বাচ্চাটি দূরে ক্ষুধার্ত। নবীজি শিকারিকে বললেন তাকে ছেড়ে দিতে। শিকারি নবীজির জামিনিতে তাকে ছাড়ল। হরিণীটি বাচ্চাকে খাইয়ে ঠিকই ফিরে এলো। শিকারি এই দৃশ্য দেখে অবাক হয়ে হরিণীটিকে পুরোপুরি মুক্ত করে দিল。<br><br><b>শিক্ষা:</b> সৃষ্টিকুলের প্রতি নবীজির দয়া ছিল তুলনাহীন।"
            },
            {
                id: 99,
                title: "উম্মতের জন্য কান্না",
                icon: "😭",
                color: "bg-indigo-300 text-indigo-900",
                text: "নবীজি (সা.) একদিন 'উম্মতি, উম্মতি' বলে অনেক কাঁদছিলেন। জিব্রাইল (আ.) এসে কারণ জিজ্ঞেস করলে নবীজি বললেন, 'আমি আমার উম্মতের ভবিষ্যতের জন্য চিন্তিত।' আল্লাহ জিব্রাইলের মাধ্যমে জানিয়ে দিলেন, 'আমি আপনার উম্মতের ব্যাপারে আপনাকে এমন কিছু দেব যে আপনি সন্তুষ্ট হয়ে যাবেন।' কিয়ামতের দিন তিনি সুপারিশের জন্য সেজদায় পড়ে কাঁদবেন。<br><br><b>শিক্ষা:</b> নবীজি আমাদের না দেখেই ভালোবাসতেন। আমাদেরও তাঁকে ভালোবাসা উচিত।"
            },
            {
                id: 100,
                title: "শেষ ওসিয়ত",
                icon: "🕊️",
                color: "bg-slate-400 text-slate-950",
                text: "মৃত্যুশয্যায় নবীজি (সা.)-এর শ্বাস নিতে কষ্ট হচ্ছিল। তিনি বারবার একটি কথাই স্মরণ করিয়ে দিচ্ছিলেন। তাঁর শেষ বাক্য ছিল: 'আস-সালাহ, আস-সালাহ (নামাজ, নামাজ)। এবং তোমাদের অধীনস্থ দাস-দাসীদের সাথে ভালো ব্যবহার করবে।' এরপর তিনি বললেন, 'হে আল্লাহ, পরম বন্ধুর সাথে মিলিত করুন।' এবং তিনি ইন্তেকাল করলেন。<br><br><b>শিক্ষা:</b> নামাজ হলো একজন মুসলিমের জীবনের শেষ শ্বাস পর্যন্ত সবচেয়ে বড় দায়িত্ব।"
            }
        ];
        
        let currentActiveStory = null;

        // --- 2. UI Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            // Splash screen logic
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.classList.add('hidden');
                    app.classList.remove('hidden');
                    app.classList.add('fade-in');
                    renderStories();
                }, 700);
            }, 2500); // 2.5s splash
        });

        function renderStories() {
            const list = document.getElementById('story-list');
            list.innerHTML = '';
            
            stories.forEach((story, index) => {
                const delay = index * 0.1;
                const card = document.createElement('div');
                card.className = `story-card bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer slide-up`;
                card.style.animationDelay = `${delay}s`;
                card.onclick = () => openStory(story.id);
                
                card.innerHTML = `
                    <div class="w-14 h-14 flex-shrink-0 rounded-full flex items-center justify-center text-2xl ${story.color}">
                        ${story.icon}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-bold text-gray-800 truncate">${story.title}</h3>
                        <p class="text-sm text-gray-500 truncate">মজাদার ও শিক্ষণীয় গল্প...</p>
                    </div>
                    <div class="w-8 h-8 flex items-center justify-center bg-teal-50 rounded-full text-teal-600">
                        <i class="ph-bold ph-caret-right"></i>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function openStory(id) {
            const story = stories.find(s => s.id === id);
            if (!story) return;
            
            currentActiveStory = story;
            
            document.getElementById('reader-title').innerText = story.title;
            document.getElementById('reader-headline').innerText = story.title;
            document.getElementById('reader-icon').innerText = story.icon;
            document.getElementById('reader-body').innerHTML = story.text;
            
            const readerView = document.getElementById('reader-view');
            readerView.classList.remove('hidden');
            // Small delay to allow display:block to apply before animation
            setTimeout(() => {
                readerView.style.transform = 'translateX(0)';
            }, 10);
        }

        function closeStory() {
            const readerView = document.getElementById('reader-view');
            readerView.style.transform = 'translateX(100%)';
            setTimeout(() => {
                readerView.classList.add('hidden');
                currentActiveStory = null;
            }, 300);
        }

        // --- 3. Share Functionality ---
        async function shareCurrentStory() {
            if (!currentActiveStory) return;
            
            const plainText = currentActiveStory.text.replace(/<[^>]*>?/gm, ''); // Remove HTML tags
            const shareText = `📚 *${currentActiveStory.title}*\n\n${plainText}\n\n📲 পড়া হয়েছে "MH Academy - ইসলামিক গল্প" অ্যাপ থেকে!`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentActiveStory.title,
                        text: shareText,
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Error sharing:', err);
                }
            } else {
                // Fallback: Copy to clipboard
                try {
                    // Use modern clipboard API if available, else fallback to execCommand
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(shareText);
                    } else {
                        const textArea = document.createElement("textarea");
                        textArea.value = shareText;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    showToast('গল্পটি কপি করা হয়েছে! এখন যেকোনো জায়গায় পেস্ট করতে পারেন।');
                } catch (err) {
                    showToast('কপি করতে সমস্যা হয়েছে।');
                }
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- 4. Single-File PWA Setup (Blob Technique) ---
        
        // A. Create Dynamic Manifest
        const manifestJSON = {
            "name": "MH Academy - ইসলামিক গল্প",
            "short_name": "ইসলামিক গল্প",
            "description": "বাচ্চাদের জন্য শিক্ষণীয় ইসলামিক গল্প",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#f0fdfa",
            "theme_color": "#0f766e",
            "icons": [
                {
                    "src": "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="#0f766e"/><path d="M192,40H64A24,24,0,0,0,40,64V192a24,24,0,0,0,24,24H192a24,24,0,0,0,24-24V64A24,24,0,0,0,192,40Zm8,152a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V64a8,8,0,0,1,8-8H192a8,8,0,0,1,8,8Z" fill="#fff"/><circle cx="128" cy="128" r="32" fill="#fff"/></svg>`),
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml",
                    "purpose": "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestJSON)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestURL;
        document.head.appendChild(manifestLink);

        // B. Install Prompt Logic
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI to notify the user they can add to home screen
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            } else {
                showToast("ইন্সটল করতে ব্রাউজারের মেনু থেকে 'Add to Home Screen' চাপুন।");
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.add('hidden');
            showToast("অ্যাপটি সফলভাবে ইন্সটল হয়েছে!");
        });
    </script>
</body>
</html>
